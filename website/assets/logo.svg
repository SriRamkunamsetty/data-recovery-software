<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Luminous Cyber Shield Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Soft Inner Shield Highlight -->
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- High-Precision Drop Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Protective Cyber Shield -->
  <path d="M 50 7
           C 68 7, 88 13, 90 28
           C 92 50, 81 76, 50 94
           C 19 76, 8 50, 10 28
           C 12 13, 32 7, 50 7 Z"
        fill="url(#shieldFill)"
        stroke="url(#rimGrad)"
        stroke-width="3"
        stroke-linejoin="round"
        filter="url(#logoGlow)" />

  <!-- Inner Translucent Glass Bevel -->
  <path d="M 50 11
           C 65 11, 83 16, 85 29
           C 87 48, 77 71, 50 88
           C 23 71, 13 48, 15 29
           C 17 16, 35 11, 50 11 Z"
        fill="url(#innerGlow)"
        stroke="#38bdf8"
        stroke-width="1.2"
        stroke-opacity="0.5" />

  <!-- Concentric Storage Platter Sector Arcs (Forensic Tracks) -->
  <path d="M 27 35 A 28 28 0 0 1 73 35" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 3" opacity="0.85" />
  <path d="M 32 44 A 21 21 0 0 1 68 44" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 5" opacity="0.9" />
  <path d="M 36 53 A 15 15 0 0 1 64 53" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 3" opacity="0.95" />

  <!-- Direct I/O Reticle / Coordinate Crosshairs -->
  <line x1="50" y1="18" x2="50" y2="27" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  <line x1="50" y1="73" x2="50" y2="82" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <line x1="18" y1="48" x2="27" y2="48" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <line x1="73" y1="48" x2="82" y2="48" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />

  <!-- Iconic Central "X" Recovery Blades -->
  <g transform="translate(50, 48)">
    <!-- White Solid Primary Blades -->
    <path d="M -12 -12 L 12 12 M 12 -12 L -12 12"
          stroke="#ffffff"
          stroke-width="4.5"
          stroke-linecap="round" />
    <!-- Cyan Energy Inlay -->
    <path d="M -8 -8 L 8 8 M 8 -8 L -8 8"
          stroke="#00f0ff"
          stroke-width="2.2"
          stroke-linecap="round" />
    <!-- Core Integrity Spark -->
    <circle cx="0" cy="0" r="4.2" fill="#00f0ff" />
    <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
  </g>

  <!-- Zero-Write Protection Anchor Node (Emerald Guarantee) -->
  <circle cx="50" cy="14" r="3" fill="#10b981" stroke="#ffffff" stroke-width="1.2" />
</svg>
